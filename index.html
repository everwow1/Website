<html lang="en">
<head>

    <title>Geometric Circle Layout</title>

    <style>

            --card-border: #444444;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-grid);
            color: var(--text-color);
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow-y: auto;
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            padding: 90px 20px 40px 20px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Top Song Info & Control Bar */
        .song-banner {
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            z-index: 10;
        }

        .song-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .song-thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            display: block;
        }

        .song-title {
            font-family: monospace;
            font-size: 0.85rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
        }

        .control-btn {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            fill: #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease, fill 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover animations strictly for control buttons */
        .control-btn:hover {
            fill: #cccccc;
            transform: scale(1.15);
        }

        .control-btn svg {
            width: 100%;
            height: 100%;
        }

        /* Volume Control Wrapper */
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .volume-slider {
            width: 60px;
            height: 4px;
            appearance: none;
            background: #221533;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #ffffff;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: #221533;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-filled {
            height: 100%;
            background: #ffffff;
            width: 0%;
            pointer-events: none;
        }

        /* Profile Container with Banner Background (No hover scale/border transition) */
        .profile-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(10, 5, 15, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Background Banner behind the circle frame */
        .profile-banner {
            width: 100%;
            height: 140px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid var(--card-border);
        }

        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.85);
        }

        /* Inner Content wrapper inside the profile container */
        .profile-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 0 25px 25px 25px;
            width: 100%;
            margin-top: -50px;
            z-index: 2;
        }

        .circle-frame {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--card-border);
            overflow: hidden;
            background-color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-left: 10px;
        }

        .circle-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        /* Hover animation strictly for Tech Stack icons */
        .badge-container i {
            font-size: 1.25rem;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge-container i:hover {
            transform: scale(1.15);
        }

        .social-links {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 2px;
            margin-bottom: 8px;
        }

        /* Hover animation strictly for Social Link icons */
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-link:hover {
            transform: translateY(-3px) scale(1.1);
        }

        .social-link svg {
            width: 100%;
            height: 100%;
        }

        /* Text Content Area */
        .text-bio-section {
            width: 100%;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #221533;
            padding-top: 15px;
            margin-top: 5px;
            font-family: monospace;
        }

        .text-bio-section h1 {
            font-size: 1.15rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .text-bio-section h2 {
            font-size: 0.95rem;
            color: #cccccc;
            letter-spacing: 0.5px;
        }

        .text-bio-section p {
            font-size: 0.85rem;
            color: #aaaaaa;
            line-height: 1.6;
        }

        #audio-container {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script>
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && e.key === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        const videoId = "p5w71XZQyNM";
        let player;
        let isPlaying = false;
        let isMuted = false;
        let lastVolume = 80;
        let progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                events: {
                    'onReady': function(event) {
                        event.target.cueVideoById(videoId);
                        event.target.setVolume(lastVolume);
                        startProgressTracker();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function togglePlayPause() {
            if (!player) return;
            const playIconPath = document.getElementById('play-icon-path');
            if (isPlaying) {
                player.pauseVideo();
                playIconPath.setAttribute('d', 'M8 5v14l11-7z'); // Play icon
                isPlaying = false;
            } else {
                player.playVideo();
                playIconPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'); // Pause icon
                isPlaying = true;
            }
        }

        function toggleMute() {
            if (!player) return;
            const muteIconPath = document.getElementById('mute-icon-path');
            const volumeSlider = document.getElementById('volume-slider');

            if (isMuted) {
                player.unMute();
                player.setVolume(lastVolume);
                volumeSlider.value = lastVolume;
                muteIconPath.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z'); // Sound icon
                isMuted = false;
            } else {
                lastVolume = player.getVolume();
                player.mute();
                volumeSlider.value = 0;
                muteIconPath.setAttribute('d', 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z'); // Mute icon
                isMuted = true;
            }
        }

        function changeVolume(e) {
            if (!player || !player.setVolume) return;
            const val = e.target.value;
            lastVolume = val;
            player.setVolume(val);
            const muteIconPath = document.getElementById('mute-icon-path');
            if (val == 0) {
                player.mute();
                isMuted = true;
                muteIconPath.setAttribute('d', 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z');
            } else {
                if (isMuted) {
                    player.unMute();
                    isMuted = false;
                }
                muteIconPath.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z');
            }
        }

        function rewindFive() {
            if (!player) return;
            let currentTime = player.getCurrentTime();
            player.seekTo(Math.max(0, currentTime - 5), true);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function startProgressTracker() {
            const filledBar = document.getElementById('progress-filled');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');

            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    let current = player.getCurrentTime();
                    let duration = player.getDuration();
                    
                    if (duration > 0) {
                        let percent = (current / duration) * 100;
                        filledBar.style.width = percent + '%';
                        currentTimeEl.textContent = formatTime(current);
                        totalDurationEl.textContent = formatTime(duration);
                    }
                }
            }, 500);
        }

        function seekAudio(e) {
            if (!player || !player.getDuration) return;
            const progressBar = document.getElementById('progress-bar');
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const duration = player.getDuration();
            
            const newTime = (clickX / width) * duration;
            player.seekTo(newTime, true);
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.title) {
                        document.querySelector('.song-title').textContent = data.title;
                    }
                })
                .catch(() => {});
        });
    </script>
